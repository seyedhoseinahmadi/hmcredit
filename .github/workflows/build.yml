name: Build HiMate Credit Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master, feature/card-user-assignment ]

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\HiMate.Agent.sln

      - name: Build
        run: dotnet build .\HiMate.Agent.sln -c Release --no-restore

      - name: Publish application
        shell: pwsh
        run: .\scripts\publish-win-x64.ps1

      - name: Stage official signed CP210x driver
        shell: pwsh
        run: .\scripts\stage-cp210x-driver.ps1

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1

      - name: Upload HiMate Credit installer
        uses: actions/upload-artifact@v4
        with:
          name: HiMate-Credit-Installer
          path: artifacts/installer/HiMate-Credit-Setup.exe
          if-no-files-found: error
