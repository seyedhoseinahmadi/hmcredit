name: Build Windows Agent

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\HiMate.Agent.sln

      - name: Build
        run: dotnet build .\HiMate.Agent.sln -c Release --no-restore

      - name: Publish self-contained win-x64
        shell: pwsh
        run: .\scripts\publish-win-x64.ps1

      - name: Build Windows installer
        shell: pwsh
        run: .\scripts\build-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiMate-Agent-Setup
          path: artifacts/installer/HiMate-Agent-Setup.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiMate-Agent-Portable-win-x64
          path: artifacts/win-x64/**
          if-no-files-found: error
