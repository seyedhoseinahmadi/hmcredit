name: Verify HiMate Agent compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows Agent
        shell: pwsh
        run: .\scripts\publish-win-x64.ps1
      - name: Upload Agent build (not installer)
        uses: actions/upload-artifact@v4
        with:
          name: HiMate-Credit-Agent-0.2.10-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
          retention-days: 14
