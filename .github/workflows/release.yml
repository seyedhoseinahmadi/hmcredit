name: Release HiMate Credit

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (example: v0.1.0)'
        required: true
        default: 'v0.2.10'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "HIMATE_VERSION=${{ inputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "HIMATE_VERSION=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Publish application
        shell: pwsh
        run: .\scripts\publish-win-x64.ps1

      - name: Stage official signed CP210x driver
        shell: pwsh
        run: .\scripts\stage-cp210x-driver.ps1

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1

      - name: Rename installer for release
        shell: pwsh
        run: |
          $version = $env:HIMATE_VERSION.TrimStart('v')
          Copy-Item ".\artifacts\installer\HiMate-Credit-Setup.exe" ".\HiMate-Credit-Setup-$version.exe"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:HIMATE_VERSION
          $version = $tag.TrimStart('v')
          gh release create "$tag" `
            ".\HiMate-Credit-Setup-$version.exe" `
            --target "${{ github.sha }}" `
            --title "HiMate Credit $tag" `
            --generate-notes
