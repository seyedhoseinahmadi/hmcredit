name: Release Windows Agent

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: .\scripts\publish-win-x64.ps1

      - name: Zip release
        shell: pwsh
        run: Compress-Archive -Path .\artifacts\win-x64\* -DestinationPath .\HiMate-Agent-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ".\HiMate-Agent-${{ github.ref_name }}-win-x64.zip" --generate-notes
